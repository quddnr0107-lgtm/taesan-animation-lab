name: Independent Korean Speech CPU Check
on:
  push:
    paths: ['.github/workflows/speech-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speech_transcript:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU speech recognition checker
        run: python -m pip install faster-whisper==1.2.0 requests==2.32.5 huggingface_hub==0.36.0
      - name: Independently transcribe generated Korean without expected-text prompt
        run: |
          mkdir -p output
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json,re,time
          from pathlib import Path
          t=time.monotonic()
          m=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=m.transcribe('studies/fixtures/004-voice.wav',language='ko',beam_size=5,condition_on_previous_text=False)
          segments=list(segments)
          transcript=''.join(s.text for s in segments).strip()
          normalize=lambda s:re.sub(r'[^가-힣a-zA-Z0-9]','',s)
          ref=normalize('안녕! 오늘은 무슨 놀이를 할까?');hyp=normalize(transcript)
          row=list(range(len(hyp)+1))
          for i,a in enumerate(ref,1):
              nr=[i]
              for j,b in enumerate(hyp,1):nr.append(min(nr[-1]+1,row[j]+1,row[j-1]+(a!=b)))
              row=nr
          cer=row[-1]/len(ref)
          report={'engine':'faster-whisper small CPU int8','expected':'안녕! 오늘은 무슨 놀이를 할까?','transcript':transcript,'normalized_character_error_rate':cer,'elapsed_seconds':round(time.monotonic()-t,2),'machine_check':cer<=.1,'limitations':['ASR can be wrong','not a perceptual acting-quality assessment','not original actor voice']}
          Path('output/asr-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert transcript,'Empty independent transcript'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-speech-transcript-${{ github.run_number }}
          path: output/
          retention-days: 14
